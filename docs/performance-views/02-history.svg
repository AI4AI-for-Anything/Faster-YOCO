  </g>
  <g id="text_25">
   <text style="fill: #79696b; font: 11px 'DejaVu Sans'; text-anchor: start" x="58.32" y="94.32" transform="rotate(-0 58.32 94.32)">Cumulative full-check speedup · 8 H100 GPUs · 2,048 tokens per GPU · 8 full checks in 25 rounds</text>
  </g>
  <g id="text_26">
   <text style="fill: #8c0000; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="67.392" y="385.493281" transform="rotate(-0 67.392 385.493281)">R03</text>
  </g>
  <g id="text_27">
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(109.512 379.119154)">Sharded ZeRO-1 work, layer CUDA</text>
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(109.512 391.124689)">graphs, one in-place all-gather</text>
  </g>
  <g id="text_28">
   <text style="fill: #8c0000; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="352.512" y="385.493281" transform="rotate(-0 352.512 385.493281)">R04</text>
  </g>
  <g id="text_29">
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(394.632 379.199623)">Compiled RMSNorm + DDP bucket</text>
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(394.632 391.124689)">views</text>
  </g>
  <g id="text_30">
   <text style="fill: #8c0000; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="67.392" y="435.893281" transform="rotate(-0 67.392 435.893281)">R07</text>
  </g>
  <g id="text_31">
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(109.512 423.596855)">Per-parameter reduction to the</text>
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(109.512 435.521922)">optimizer-state owner, no host</text>
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(109.512 447.446988)">syncs</text>
  </g>
  <g id="text_32">
   <text style="fill: #8c0000; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="352.512" y="435.893281" transform="rotate(-0 352.512 435.893281)">R09</text>
  </g>
  <g id="text_33">
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'; text-anchor: start" x="394.632" y="435.562156" transform="rotate(-0 394.632 435.562156)">Triton RMSNorm</text>
  </g>
  <g id="text_34">
   <text style="fill: #8c0000; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="67.392" y="486.293281" transform="rotate(-0 67.392 486.293281)">R17</text>
  </g>
  <g id="text_35">
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(109.512 473.996855)">Owner embedding gradient, fused</text>
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(109.512 486.002391)">subln, compiled retention, Triton</text>
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(109.512 497.927457)">loss</text>
  </g>
  <g id="text_36">
   <text style="fill: #8c0000; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="352.512" y="486.293281" transform="rotate(-0 352.512 486.293281)">R18</text>
  </g>
  <g id="text_37">
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(394.632 479.919154)">Gradient reduction through the</text>
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(394.632 491.924689)">copy engines</text>
  </g>
  <g id="text_38">
   <text style="fill: #8c0000; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="67.392" y="536.693281" transform="rotate(-0 67.392 536.693281)">R19</text>
  </g>
  <g id="text_39">
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(109.512 530.319154)">Embedding gradient rows through</text>
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(109.512 542.324689)">the copy engines</text>
  </g>
  <g id="text_40">
   <text style="fill: #8c0000; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="352.512" y="536.693281" transform="rotate(-0 352.512 536.693281)">R25</text>
  </g>
  <g id="text_41">
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(394.632 524.396855)">Fused Adam + bf16 cast, Triton</text>
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(394.632 536.321922)">gradient scaling, fused q/k/v/g</text>
   <text style="fill: #292122; font: 700 10.3px 'DejaVu Sans'" transform="translate(394.632 548.327457)">GEMM</text>
  </g>
  <g id="text_42">
   <text style="fill: #79696b; font: 9.3px 'DejaVu Sans'" transform="translate(58.32 591.94545)">Each point is a full check by the same frozen judge on the same host; every configuration passed the statistical gate.</text>
   <text style="fill: #79696b; font: 9.3px 'DejaVu Sans'" transform="translate(58.32 603.772725)">R17 combines rounds 10–16, R25 rounds 21, 22 and 25. Target was 3×; the run was stopped after round 28, and rounds</text>
   <text style="fill: #79696b; font: 9.3px 'DejaVu Sans'" transform="translate(58.32 615.6)">26–28 are not included. Cumulative configurations, not isolated ablations.</text>
  </g>
 </g>
