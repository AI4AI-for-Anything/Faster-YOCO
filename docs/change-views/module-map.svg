   <g id="text_1">
    <text style="fill: #292122; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="35.64" y="36.72" transform="rotate(-0 35.64 36.72)">What changed in Faster-YOCO</text>
   </g>
   <g id="text_2">
    <text style="fill: #8c0000; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="44.712" y="95.472" transform="rotate(-0 44.712 95.472)">01</text>
   </g>
   <g id="text_3">
    <text style="fill: #79696b; font: 10px 'DejaVu Sans'; text-anchor: end" x="301.32" y="95.472" transform="rotate(-0 301.32 95.472)">2 files</text>
   </g>
   <g id="text_4">
    <text style="fill: #292122; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="44.712" y="117.9936" transform="rotate(-0 44.712 117.9936)">ZeRO-1 optimizer path</text>
   </g>
   <g id="text_5">
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(44.712 151.203206)">FP32 work only on the owned shard</text>
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(44.712 165.725138)">One in-place bf16 all-gather</text>
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(44.712 180.247069)">Adam fused with the bf16 cast</text>
   </g>
   <g id="text_6">
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(44.712 229.696969)">tasks/zero1_fast.py</text>
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(44.712 242.352)">tasks/fused_adam_cast.py</text>
   </g>
   <g id="text_7">
    <text style="fill: #8c0000; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="339.552" y="95.472" transform="rotate(-0 339.552 95.472)">02</text>
   </g>
   <g id="text_8">
    <text style="fill: #79696b; font: 10px 'DejaVu Sans'; text-anchor: end" x="596.16" y="95.472" transform="rotate(-0 596.16 95.472)">3 files</text>
   </g>
   <g id="text_9">
    <text style="fill: #292122; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="339.552" y="117.9936" transform="rotate(-0 339.552 117.9936)">Gradient reduction</text>
   </g>
   <g id="text_10">
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(339.552 151.203206)">Reduce to the optimizer-state owner</text>
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(339.552 165.725138)">Copy engines instead of NCCL kernels</text>
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(339.552 180.247069)">Embedding gradient formed on its owner</text>
   </g>
   <g id="text_11">
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(339.552 217.041937)">models/decoder/ce_reduce.py</text>
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(339.552 229.696969)">models/decoder/layer_graphs.py</text>
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(339.552 242.352)">tasks/zero1_fast.py (clip norm)</text>
   </g>
   <g id="text_12">
    <text style="fill: #8c0000; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="44.712" y="301.104" transform="rotate(-0 44.712 301.104)">03</text>
